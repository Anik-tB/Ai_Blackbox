[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aidbg"
version = "0.1.0"
description = "AI Black Box Debugger - Collect evidence, reconstruct execution, explain root causes, suggest fixes"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AIBD Team" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "aiosqlite>=0.20.0",
    "httpx>=0.27.0",
    "typer>=0.9.0",
    "rich>=13.7.0",
    "networkx>=3.2.0",
    "opentelemetry-api>=1.23.0",
    "opentelemetry-sdk>=1.23.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "asyncpg>=0.29.0",
    "supabase>=2.3.0",
]

[project.scripts]
aidbg = "aidbg.cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["aidbg*"]

[tool.setuptools.package-data]
"aidbg.agent" = ["*.cjs", "*.js"]

